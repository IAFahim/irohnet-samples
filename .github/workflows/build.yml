name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: irohnet/iroh-bindgen
      - name: Build native assets (linux-x64)
        run: dotnet build irohnet/N0.IrohNet.NativeAssets.Linux/N0.IrohNet.NativeAssets.Linux.csproj -f net10.0 -r linux-x64
      - name: Build sample
        run: dotnet build src/Chat/IrohNet.Samples.Chat.csproj -f net10.0 -r linux-x64 -p:TargetFrameworks=net10.0 -c Release
